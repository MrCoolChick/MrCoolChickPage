<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友真心話大抽籤</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>朋友真心話抽籤</h1>
        <p>這是一個適合朋友聚會的遊戲。抽出一組題目之後，指派一個人當作猜測者，其餘玩家共同選擇其中一個題目，不能讓猜測者知道題目是哪個。玩家依據共同選擇的題目，各自回答出心目中的答案。猜測者依據答案去猜測選擇的題目。</p>
        <div class="controls">
            <button id="drawBtn">抽題目</button>
            <button id="resetBtn">重置題庫</button>
            <button id="backBtn" type="button" onclick="location.href='../../index.html'">回到 MrCoolChickPage</button>
        </div>
        <div id="questionArea" class="question-grid"></div>
    </div>
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
