<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清大美食輪盤</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>清大美食輪盤</h1>
        <div class="wheel-area" aria-label="輪盤區域">
            <div class="wheel-wrap">
                <canvas id="wheelCanvas" width="360" height="360" aria-label="美食輪盤"></canvas>
                <div class="pointer" aria-hidden="true"></div>
            </div>
        </div>
        <div class="controls">
            <button id="drawBtn" type="button">轉動輪盤</button>
            <button id="backBtn" type="button" onclick="location.href='../../index.html'">回到 MrCoolChickPage</button>
        </div>
        <div id="result" class="result" aria-live="polite">按下「轉動輪盤」開始抽籤</div>
    </div>
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
